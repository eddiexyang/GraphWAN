name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Linux releases
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: sha-${{ github.sha }}
      CGO_ENABLED: '0'
      GOOS: linux
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare release paths
        run: |
          echo "RELEASE_DIR=$RUNNER_TEMP/graphwan-release" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/graphwan-release"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: Build embedded frontend
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Build Linux amd64
        env:
          GOARCH: amd64
          GOAMD64: v1
        run: >-
          go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=$RELEASE_TAG"
          -o "$RELEASE_DIR/graphwan-$RELEASE_TAG-linux-amd64" ./cmd/graphwan
      - name: Build Linux arm64
        env:
          GOARCH: arm64
          GOARM64: v8.0
        run: >-
          go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=$RELEASE_TAG"
          -o "$RELEASE_DIR/graphwan-$RELEASE_TAG-linux-arm64" ./cmd/graphwan
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and publish controller image
        uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published; leaving its assets intact."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_REVISION" --draft \
              --title "$RELEASE_TAG" --generate-notes --prerelease \
              --notes "Controller image digest: $IMAGE_DIGEST"
          fi
          gh release upload "$RELEASE_TAG" "$RELEASE_DIR"/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
