name: Release

on:
  push:
    branches:
      - master
      # Feature branches publish prereleases for staged deployment.
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Linux releases
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image_digest: ${{ fromJSON(steps.build.outputs.metadata).controller['containerimage.digest'] }}
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: sha-${{ github.sha }}
      RELEASE_DIR: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Name the Agent image
        # Registry names must be lowercase.
        run: echo "AGENT_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-agent:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build binaries and publish controller and Agent images
        uses: docker/bake-action@v7
        id: build
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.metadata.outputs.bake-file-tags }}
            ${{ steps.metadata.outputs.bake-file-labels }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          IMAGE_DIGEST: ${{ fromJSON(steps.build.outputs.metadata).controller['containerimage.digest'] }}
          AGENT_DIGEST: ${{ fromJSON(steps.build.outputs.metadata).agent['containerimage.digest'] }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published; leaving its assets intact."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_REVISION" --draft \
              --title "$RELEASE_TAG" --generate-notes --prerelease \
              --notes "Controller image digest: $IMAGE_DIGEST
          Agent image: $AGENT_IMAGE@$AGENT_DIGEST"
          fi
          gh release upload "$RELEASE_TAG" "$RELEASE_DIR"/graphwan-* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
